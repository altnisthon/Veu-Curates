<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undertone lean</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#932D28;text-decoration:none}a:hover{color:#6E1F1B}
input,button{font:inherit}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif !important;font-weight:600 !important;letter-spacing:0 !important}
h1{font-size:40px !important;line-height:44px !important}
.serif{font-family:'Cormorant Garamond',Georgia,serif !important}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.06)}100%{transform:translate(0,0) scale(1)}}
.orb{animation:drift 14s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.orb{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDF8F5; font-family: Montserrat, -apple-system, system-ui, sans-serif; color: #1E1412; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div class="orb" style="position: absolute; width: 360px; height: 360px; left: -120px; top: -80px; border-radius: 50%; background: #F1BAB3; filter: blur(70px); opacity: 0.85"></div>
<div class="orb" style="position: absolute; width: 300px; height: 300px; right: -140px; top: 260px; border-radius: 50%; background: #D75C61; filter: blur(80px); opacity: 0.35; animation-delay: -5s"></div>
<div class="orb" style="position: absolute; width: 320px; height: 320px; left: -100px; bottom: -60px; border-radius: 50%; background: #81A357; filter: blur(90px); opacity: 0.28; animation-delay: -9s"></div>
<div style="position: absolute; width: 260px; height: 260px; right: -60px; bottom: 120px; border-radius: 50%; background: #E8E3D8; filter: blur(60px); opacity: 0.9"></div>
</div>

<div style="position: absolute; inset: 0; padding: 54px 16px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Main.dc.html" style="font-size: 17px; min-height: 44px; display: flex; align-items: center">Cancel</a>
</div>
<nav aria-label="You are here" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: #6B5450; padding: 0 4px; margin-bottom: -8px"><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="#932D28" stroke-width="1.6" aria-hidden="true"><path d="M6 13s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C1.5 8.8 6 13 6 13z"/><circle cx="6" cy="5.5" r="1.6"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">You are here:</span><a href="Main.dc.html" style="color: #6B5450; min-height: 28px; display: inline-flex; align-items: center">Home</a><span aria-hidden="true" style="color: #6B5450">›</span><span aria-current="page" style="color: #000; font-weight: 600">Undertone</span></nav>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Do you lean warm, cool or neutral?</h1>
<p style="margin: 0; font-size: 17px; line-height: 22px; color: #6B5450">Go with your gut. It sets where Studio starts, and you can change it any time.</p>
</div>
<div role="radiogroup" aria-label="Undertone lean" style="background: rgba(255,255,255,0.52); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 10px 30px rgba(147,45,40,0.08); border-radius: 18px; overflow: hidden">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: transparent; border: 0; border-bottom: 0.5px solid rgba(147,45,40,0.14); text-align: left; cursor: pointer; color: #000">
<span style="display: flex"><span style="width: 24px; height: 24px; border-radius: 50%; background: {{o.c1}}"></span><span style="width: 24px; height: 24px; border-radius: 50%; margin-left: -6px; background: {{o.c2}}; box-shadow: 0 0 0 2px #fff"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 17px">{{o.label}}</span><span style="font-size: 15px; color: #6B5450">{{o.sub}}</span></span>
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#932D28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 7.5 6.5 12 16.5 1.5"/></svg></sc-if>
</button>
</sc-for>
</div>
<p style="margin: 0 12px; font-size: 13px; line-height: 18px; color: #6B5450; text-align: center">Your actual season is found in person at a VEU consultation.</p>
<div style="flex: 1"></div>
<a href="Result.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #932D28; color: #fff; font-size: 17px; font-weight: 600; border: 0; width: 100%">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
state = { pick: 0 };
renderVals() {
const L = [{"label": "Warm", "sub": "Golden, peachy, coral", "c1": "#F2A65A", "c2": "#F26B4E"}, {"label": "Cool", "sub": "Pink, rosy, berry", "c1": "#E58FB0", "c2": "#B03A6A"}, {"label": "Neutral", "sub": "A bit of both", "c1": "#E9A08E", "c2": "#C9736E"}, {"label": "Not sure", "sub": "We'll start you neutral", "c1": "#D9D3CF", "c2": "#B9B1AC"}];
return { opts: L.map((o, i) => Object.assign({}, o, { on: this.state.pick === i, pick: () => this.setState({ pick: i }) })) };
}
}
</script>
</body>
</html>
